name: irforge_pay
description: IrForge Pay Agent — forwards bank SMS to the IrForge webhook, resilient to IP/VPN changes.
publish_to: none
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.2
  mobile_scanner: ^5.2.3
  shared_preferences: ^2.3.2
  url_launcher: ^6.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true
  assets:
    - assets/icon.png

# آیکن را برای همه‌ی تراکم‌ها (mdpi…xxxhdpi، iOS) خودکار تولید می‌کند — bootstrap.sh صدایش می‌زند.
flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/icon.png
  adaptive_icon_background: "#F2701C"
  adaptive_icon_foreground: assets/icon_fg.png
  remove_alpha_ios: true
