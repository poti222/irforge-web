name: Build Android APK
on:
  workflow_dispatch:
  push:
    paths: ["mobile/**", ".github/workflows/build-android.yml"]
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }
      - name: Bootstrap + test
        working-directory: mobile
        run: |
          ./bootstrap.sh
          flutter analyze
          flutter test
      # آیکن‌ها/منابع را اندروید خودش بر اساس تراکمِ صفحه‌ی هر گوشی انتخاب می‌کند؛
      # برای حجم: R8/shrink پیش‌فرضِ release است + نسخه‌ی جداگانه به‌ازای هر معماریِ CPU (کوچک‌تر).
      - name: Build universal APK (یک فایل برای همه‌ی گوشی‌ها)
        working-directory: mobile
        run: flutter build apk --release
      - name: Build per-ABI APKs (کوچک‌تر)
        working-directory: mobile
        run: flutter build apk --release --split-per-abi
      - name: Report sizes
        run: ls -lh mobile/build/app/outputs/flutter-apk/*.apk
      - uses: actions/upload-artifact@v4
        with:
          name: irforge-pay-agent-apk
          path: mobile/build/app/outputs/flutter-apk/*.apk
