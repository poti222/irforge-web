name: Build Android APK
on:
  workflow_dispatch:
  push:
    paths: ["mobile/**", ".github/workflows/build-android.yml"]
jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }

      # امضای ثابت: بدونِ آن آپدیتِ داخلِ اپ کار نمی‌کند (راهنما: mobile/tools/make-keystore.sh)
      - name: Prepare release signing
        if: env.HAS_KEYSTORE == 'true'
        working-directory: mobile
        run: |
          mkdir -p android/app
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > release.jks
          echo "KEYSTORE_READY=1" >> "$GITHUB_ENV"
      - name: Bootstrap + test
        working-directory: mobile
        run: |
          ./bootstrap.sh
          flutter analyze
          flutter test
      - name: Write key.properties
        if: env.HAS_KEYSTORE == 'true'
        working-directory: mobile
        run: |
          mv release.jks android/app/release.jks
          cat > android/key.properties <<EOF
          storeFile=release.jks
          storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          EOF
      - name: Warn if unsigned-by-release-key
        if: env.HAS_KEYSTORE != 'true'
        run: echo "::warning::ANDROID_KEYSTORE_BASE64 تنظیم نشده؛ APK با کلید debug امضا شد و آپدیتِ داخلِ اپ روی نصب‌های قبلی کار نمی‌کند."

      # versionCode افزایشی = شماره‌ی اجرا (همان AGENT_VERSION_CODE)
      - name: Build universal APK (یک فایل برای همه‌ی گوشی‌ها — همین را برای آپدیت استفاده کنید)
        working-directory: mobile
        run: |
          flutter build apk --release --build-number=${{ github.run_number }} --build-name=1.0.${{ github.run_number }}
          mkdir -p ../dist
          cp build/app/outputs/flutter-apk/app-release.apk ../dist/irforge-pay-agent.apk
      - name: Per-ABI APKs (کوچک‌تر)
        working-directory: mobile
        run: |
          flutter build apk --release --split-per-abi --build-number=${{ github.run_number }} --build-name=1.0.${{ github.run_number }}
          cp build/app/outputs/flutter-apk/app-*-release.apk ../dist/ || true
      - name: Release values for the server
        run: |
          SHA=$(sha256sum dist/irforge-pay-agent.apk | cut -d' ' -f1)
          ls -lh dist
          {
            echo "## مقادیرِ انتشارِ این نسخه"
            echo '```'
            echo "AGENT_VERSION_CODE=${{ github.run_number }}"
            echo "AGENT_VERSION_NAME=1.0.${{ github.run_number }}"
            echo "AGENT_APK_SHA256=$SHA"
            echo "AGENT_APK_URL=<لینکِ https مستقیم به فایلِ irforge-pay-agent.apk>"
            echo '```'
            echo "این چهار env را روی سرور (Railway) بگذارید؛ اپ‌ها خودشان خبردار می‌شوند."
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: irforge-pay-agent-apk
          path: dist/*.apk

  smoke:
    # اپ را روی شبیه‌ساز واقعیِ اندروید اجرا می‌کند تا کرشِ لحظه‌ی اول قبل از رسیدن به گوشی پیدا شود.
    needs: apk
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: irforge-pay-agent-apk
          path: dist
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: bash mobile/tools/smoke.sh dist/irforge-pay-agent.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-output
          path: smoke-out/
