    <!--
      NOTE [hreflang]: the language switcher (en/fa/ar/tr/ru) swaps content
      client-side via localStorage against a single URL (irforge.ir/), it
      doesn't route to language-specific URLs like /en/ or ?lang=en. hreflang
      tags are a promise to search engines that *different URLs* serve
      *different languages* — pointing several hreflang variants at the same
      URL is at best ignored and at worst flagged as invalid. So there's
      intentionally no hreflang block here. If English (or another language)
      search traffic becomes a priority, the real fix is language-specific
      routes (e.g. /en/*) rendered with that language's content server-side
      or via a static prerender, each with its own canonical + hreflang set
      pointing at the others. Until then, Google will index the fa_IR
      version reflected in this file's lang/og:locale, which matches what
      irforge.ir actually shows by default.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!--
      FIX [lang]: تنظیم زبان و جهت — قبل از render اجرا می‌شه.

      این سه لیست باید همیشه با src/lib/i18n.ts یکی بمونن:
        VALID   ← LANGUAGES
        RTL     ← RTL_LANGS  (fa و ar — نه فقط fa)
        DEFAULT ← DEFAULT_LANG
      اگه از هم جدا بشن، صفحه با dir اشتباه لود می‌شه و تا وقتی کاربر
      دستی زبان رو عوض نکنه همون‌طور می‌مونه (باگ قبلی: عربی با dir=ltr
      لود می‌شد، و بازدید اول با محتوای انگلیسی ولی dir=rtl).
    -->
    <script>
      (function () {
        var VALID = ["en", "fa", "ar", "tr", "ru"];
        var RTL = ["fa", "ar"];
        var DEFAULT = "en";
        var stored = null;
        try {
          stored = localStorage.getItem("irforge_lang");
        } catch (e) {
          // localStorage بلاک — می‌ریم سراغ پیش‌فرض
        }
        var lang = VALID.indexOf(stored) !== -1 ? stored : DEFAULT;
        var html = document.documentElement;
        html.setAttribute("lang", lang);
        html.setAttribute("dir", RTL.indexOf(lang) !== -1 ? "rtl" : "ltr");
      })();
    </script>

    <!--
      FIX [1.3]: Anti-flash theme script — باید قبل از هر چیز اجرا بشه.
      next-themes تم رو از localStorage می‌خونه ولی قبل از hydrate کلاس
      .dark روی <html> نیست → فلش سفید. این اسکریپت بلافاصله کلاس درست
      رو ست می‌کنه تا فلش نباشه.
    -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem("theme");
          var theme = stored || "dark"; // defaultTheme="dark" مثل App.tsx
          if (theme === "dark") {
            document.documentElement.classList.add("dark");
          } else if (theme === "system") {
            if (window.matchMedia("(prefers-color-scheme: dark)").matches) {
              document.documentElement.classList.add("dark");
            }
          }
          // "light" → کلاس اضافه نمی‌کنیم، پیش‌فرض سفیده
        } catch (e) {
          // localStorage بلاک شده — dark پیش‌فرض
          document.documentElement.classList.add("dark");
        }
      })();
    </script>
