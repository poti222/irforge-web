<!DOCTYPE html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <!--
      NOTE [a11y]: no `maximum-scale` / `user-scalable=no`. Pinning the scale
      stops a low-vision visitor from zooming, which is exactly the group that
      needs to; Lighthouse fails the page for it. iOS' old "zooms on focused
      input" quirk — the usual reason people add this — is already handled by
      the design: every input is at least 16px, which is what actually
      suppresses that zoom.
    -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>IrForge | ساخت ربات تلگرام بدون کدنویسی</title>
    <meta name="description" content="با IrForge بدون نیاز به کدنویسی ربات تلگرام بسازید؛ پلاگین نصب کنید، دستورات دلخواه تعریف کنید و ربات خود را در چند دقیقه راه‌اندازی، شخصی‌سازی و مدیریت کنید." />
    <meta name="keywords" content="ساخت ربات تلگرام, ربات تلگرام بدون کدنویسی, بات ساز تلگرام, پلتفرم ساخت بات, اتوماسیون تلگرام, IrForge" />
    <link rel="canonical" href="https://irforge.ir/" />
    <meta name="robots" content="index, follow" />
    <meta property="og:title" content="IrForge | ساخت ربات تلگرام بدون کدنویسی" />
    <meta property="og:description" content="با IrForge بدون نیاز به کدنویسی ربات تلگرام بسازید؛ پلاگین نصب کنید، دستورات دلخواه تعریف کنید و ربات خود را در چند دقیقه راه‌اندازی، شخصی‌سازی و مدیریت کنید." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://irforge.ir/" />
    <meta property="og:locale" content="fa_IR" />
    <meta property="og:site_name" content="IrForge" />
    <meta property="og:image" content="https://irforge.ir/og-image.png?v=2" />
    <!-- Enamad domain-ownership verification — do not remove until Enamad's
         review completes and the trust seal is issued; this is a one-time
         proof-of-control check, not a permanent site feature.
         NOTE: no space between name="enamad" and content="..." — Enamad's
         own checker appears to do a literal substring match against the
         exact snippet it hands out, not real HTML parsing, so the earlier
         (perfectly valid, semantically identical) spaced version kept
         failing their check even though every browser parses both forms
         identically. Keep this exact spelling, don't "clean it up". -->
    <meta name="enamad"content="8478250" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="IrForge — ساخت ربات تلگرام بدون کدنویسی" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://irforge.ir/" />
    <meta name="twitter:title" content="IrForge | ساخت ربات تلگرام بدون کدنویسی" />
    <meta name="twitter:description" content="با IrForge بدون نیاز به کدنویسی ربات تلگرام بسازید؛ پلاگین نصب کنید، دستورات دلخواه تعریف کنید و ربات خود را در چند دقیقه راه‌اندازی، شخصی‌سازی و مدیریت کنید." />
    <meta name="twitter:image" content="https://irforge.ir/og-image.png?v=2" />
    <!--
      Google's favicon crawler wants a square icon that is a multiple of 48px;
      favicon-96.png covers that. The brand icon shown next to a search result
      comes from Organization.logo in the JSON-LD (a square 1254x1254), not
      from these tags — see src/lib/structured-data.ts.

      /favicon.png is intentionally NOT linked as a browser icon: it is 909 kB
      and browsers would fetch it for a 16px tab slot.
    -->
    <link rel="icon" type="image/png" sizes="96x96" href="/favicon-96.png" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />

    <!--
      hreflang/canonical are NOT in this template: scripts/ssg.mjs injects a
      full reciprocal set (plus x-default) per prerendered page. See
      src/lib/lang-routing.ts for the URL architecture.
    -->
    <!--
      NOTE [perf]: Inter and Vazirmatn used to be two render-blocking
      <link rel="stylesheet"> requests to fonts.googleapis.com (plus two
      preconnects). They are now self-hosted variable fonts, @import-ed from
      src/index.css so they ship inside the one stylesheet this page already
      blocks on — no extra origin, no extra round-trip, and no dependency on a
      Google domain that is frequently unreachable from Iran. See the comment
      at the top of src/index.css.
    -->
    <!--
      NOTE [perf]: telegram-web-app.js was previously loaded synchronously
      here on every single page (render-blocking), but nothing in src/
      references window.Telegram — it was dead weight. If/when a Telegram
      Mini App integration is actually built, load it with `defer` (or lazy
      import it only inside the component that needs it) instead of blocking
      first paint on every route.
    -->

    <!--
      FIX [lang]: تنظیم زبان و جهت — قبل از render اجرا می‌شه.

      این سه لیست باید همیشه با src/lib/i18n.ts یکی بمونن:
        VALID   ← LANGUAGES
        RTL     ← RTL_LANGS   (fa و ar — نه فقط fa)
        DEFAULT ← DEFAULT_LANG (fa — زبانِ ریشه، هم‌راستا با تگ استاتیک
                  <html lang="fa" dir="rtl"> و og:locale=fa_IR بالاتر)
      اگه از هم جدا بشن، صفحه با dir اشتباه لود می‌شه و تا وقتی کاربر
      دستی زبان رو عوض نکنه همون‌طور می‌مونه (باگ قبلی: عربی با dir=ltr
      لود می‌شد، و بازدید اول با محتوای انگلیسی ولی dir=rtl).
    -->
    <script>
      (function () {
        var VALID = ["en", "fa", "ar", "tr", "ru"];
        var RTL = ["fa", "ar"];
        var DEFAULT = "fa";

        // ترتیب دقیقاً همون readInitialLang() در src/hooks/use-language.ts:
        // پیشوند زبان در URL هست → همون، نیست → زبان ریشه. عمداً اینجا
        // localStorage خونده نمی‌شه: URL تعیین‌کننده‌ست، و اگه کاربر زبان
        // دیگه‌ای ذخیره کرده باشه، خودِ اپ (useCanonicalLangPath) اونو به URL
        // زبان خودش ریدایرکت می‌کنه. اگه اینجا localStorage رو می‌خوندیم،
        // `/` یه فریم با lang/dir انگلیسی ولی محتوای فارسی رنگ می‌شد.
        var seg = (location.pathname.split("/")[1] || "").toLowerCase();
        var lang = VALID.indexOf(seg) !== -1 ? seg : DEFAULT;

        var html = document.documentElement;
        html.setAttribute("lang", lang);
        html.setAttribute("dir", RTL.indexOf(lang) !== -1 ? "rtl" : "ltr");
      })();
    </script>

    <!--
      FIX [1.3]: Anti-flash theme script — باید قبل از هر چیز اجرا بشه.
      next-themes تم رو از localStorage می‌خونه ولی قبل از hydrate کلاس
      .dark روی <html> نیست → فلش. این اسکریپت بلافاصله کلاس درست
      رو ست می‌کنه تا فلش نباشه.

      IRFORGE_PROMPT_V3 Phase 46 — پیش‌فرض حالا "light" است، نه "dark"
      (App.tsx: defaultTheme="light", enableSystem={false}). این دو
      همیشه باید دقیقاً یکی باشند: پیش‌فرضِ اینجا فقط برای رنگِ اولین
      پینت پیش از hydrate است، ولی اگر با defaultTheme خودِ
      ThemeProvider جور نباشد، دقیقاً همان فلش را برعکس دوباره می‌سازد —
      یک‌بار قبل از hydrate یک تم، یک‌بار بعدش یکی دیگر. دیگر شاخه‌ی
      "system" هم لازم نیست: enableSystem خاموش است و تنها کنترلِ تمِ
      اپ (ThemeToggleButton) هیچ‌وقت "system" را ست نمی‌کند.
    -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem("theme");
          if (stored === "dark") {
            document.documentElement.classList.add("dark");
          }
          // ذخیره‌نشده، یا "light" → کلاس اضافه نمی‌شود، پیش‌فرض سفیده
        } catch (e) {
          // localStorage بلاک شده — light پیش‌فرض، بدون کلاس
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
